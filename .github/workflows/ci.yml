name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'
  PUPPETEER_SKIP_DOWNLOAD: 'true'
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: public-ci-placeholder
  SUPABASE_SERVICE_ROLE_KEY: server-ci-placeholder
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

jobs:
  quality:
    name: Lint, types, unit and security tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - name: Full unit suite
        run: npm run test:run
      - name: Explicit migration and security suite
        run: npm run test:security

  build:
    name: Production build and bundle budget
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enforce client JavaScript budget
        run: npm run check:bundle
      - name: Save production build for browser tests
        uses: actions/upload-artifact@v4
        with:
          name: next-production-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 3

  browser:
    name: Playwright desktop, mobile and accessibility
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: next-production-build
          path: .next
      - id: playwright-version
        run: echo "version=$(node -p \"require('@playwright/test/package.json').version\")" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-chromium-${{ steps.playwright-version.outputs.version }}
      - name: Install Chromium browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Chromium system dependencies
        run: npx playwright install-deps chromium
      - run: npm run test:e2e
        env:
          CI: '1'
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run start
      - name: Upload Playwright diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
